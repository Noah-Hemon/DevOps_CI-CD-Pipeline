name: Release

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Create backend env file
        run: printf '%s' "${{ secrets.BACKEND_ENV }}" > backend/.env

      - name: Build frontend image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/project-frontend:${{ github.sha }} -f frontend/Dockerfile frontend

      - name: Push frontend image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/project-frontend:${{ github.sha }}

      - name: Build backend image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/project-backend:${{ github.sha }} -f backend/Dockerfile backend

      - name: Push backend image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/project-backend:${{ github.sha }}
