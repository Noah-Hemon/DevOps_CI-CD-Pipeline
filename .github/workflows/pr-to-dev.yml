name: CI

on:
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
 
      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master
 
      - name: Install dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci
 
      - name: Lint
        run: |
          cd backend && ESLINT_USE_FLAT_CONFIG=false npx eslint . --env jest
          cd ../frontend && ESLINT_USE_FLAT_CONFIG=false npm run lint
 
      - name: Security scan (critical only)
        run: |
          cd backend && snyk test --severity-threshold=critical
          cd ../frontend && snyk test --severity-threshold=critical
 
      - name: Tests
        run: |
          cd backend && npm test
          cd ../frontend && npm test
 
      - name: Build Docker images
        run: |
          docker build -t backend:pr-${{ github.sha }} -f backend/Dockerfile backend
          docker build -t frontend:pr-${{ github.sha }} -f frontend/Dockerfile frontend